[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-security-scanner"
version = "1.0.0"
description = "Universal interactive code security scanner with executive-grade reporting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Universal Security Scanner"}
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "pydantic>=2.8.0",
  "packaging>=24.0",
  "reportlab>=4.2.0",
  "paramiko>=3.4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
uss = "universal_security_scanner.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["universal_security_scanner*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
