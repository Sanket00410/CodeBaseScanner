[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentinelx-engine"
version = "1.0.0"
description = "CodeSentinelX desktop and engine for local codebase security analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "CodeSentinelX"}
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "pydantic>=2.8.0",
  "packaging>=24.0",
  "reportlab>=4.2.0",
  "paramiko>=3.4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
codesentinelx = "codesentinelx_engine.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["codesentinelx_engine*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]



