name: CodeSentinelX-PR-Scan

on:
  pull_request:
    branches: ["main", "master"]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanner
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run differential scan
        run: |
          uss scan --path . --format json --output scan-report.json --no-progress

      - name: Convert to SARIF
        run: |
          uss scan --path . --format sarif --output scan-report.sarif --no-progress || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codesentinelx-reports
          path: |
            scan-report.json
            scan-report.sarif

      - name: Policy gate
        run: |
          CRITICAL_COUNT=$(jq '[.technical_report.findings[] | select(.severity=="Critical")] | length' scan-report.json)
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "Blocking merge: critical vulnerabilities detected ($CRITICAL_COUNT)."
            exit 1
          fi
