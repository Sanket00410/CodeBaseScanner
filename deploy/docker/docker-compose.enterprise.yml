version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:-codesentinel}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      POSTGRES_DB: codesentinelx
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-codesentinel} -d codesentinelx"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.authc.api_key.enabled=true
      - ELASTIC_PASSWORD=${ES_PASSWORD:?Set ES_PASSWORD in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ES_PORT:-9200}:9200"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-codesentinel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      - ALLOW_ANONYMOUS_LOGIN=no
      - ZOO_SERVER_USERS=${ZK_USER:-admin}
      - ZOO_SERVER_PASSWORDS=${ZK_PASSWORD:?Set ZK_PASSWORD in .env}
    ports:
      - "${ZK_PORT:-2181}:2181"

  kafka:
    image: bitnami/kafka:3.8
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=no
      - KAFKA_CFG_LISTENERS=SASL_PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=SASL_PLAINTEXT://kafka:9092
      - KAFKA_CLIENT_USERS=${KAFKA_USER:-codesentinel}
      - KAFKA_CLIENT_PASSWORDS=${KAFKA_PASSWORD:?Set KAFKA_PASSWORD in .env}
      - KAFKA_CFG_SASL_MECHANISM=PLAIN
      - KAFKA_CFG_SECURITY_INTER_BROKER_PROTOCOL=SASL_PLAINTEXT
      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"

  scan-orchestrator:
    build: ../../services/scan-orchestrator
    ports:
      - "8081:8080"
    depends_on:
      - rabbitmq
      - redis
      - postgres

  finding-service:
    build: ../../services/finding-service
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - elasticsearch

  report-service:
    build: ../../services/report-service
    ports:
      - "8083:8080"
    depends_on:
      - postgres

  identity-service:
    build: ../../services/identity-service
    ports:
      - "8084:8080"

  integration-service:
    build: ../../services/integration-service
    ports:
      - "8085:8080"
    depends_on:
      - kafka

  audit-service:
    build: ../../services/audit-service
    ports:
      - "8086:8080"
    depends_on:
      - kafka
      - postgres

volumes:
  pgdata:
