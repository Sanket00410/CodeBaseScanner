version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: codesentinel
      POSTGRES_PASSWORD: codesentinel
      POSTGRES_DB: codesentinelx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.8
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"

  scan-orchestrator:
    build: ../../services/scan-orchestrator
    ports:
      - "8081:8080"
    depends_on:
      - rabbitmq
      - redis
      - postgres

  finding-service:
    build: ../../services/finding-service
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - elasticsearch

  report-service:
    build: ../../services/report-service
    ports:
      - "8083:8080"
    depends_on:
      - postgres

  identity-service:
    build: ../../services/identity-service
    ports:
      - "8084:8080"

  integration-service:
    build: ../../services/integration-service
    ports:
      - "8085:8080"
    depends_on:
      - kafka

  audit-service:
    build: ../../services/audit-service
    ports:
      - "8086:8080"
    depends_on:
      - kafka
      - postgres

volumes:
  pgdata:
