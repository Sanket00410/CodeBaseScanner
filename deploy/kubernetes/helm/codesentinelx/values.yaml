global:
  imagePullPolicy: IfNotPresent
  namespace: security

services:
  - name: scan-orchestrator
    image: ghcr.io/example/codesentinelx/scan-orchestrator:latest
    replicas: 2
    port: 8080
  - name: finding-service
    image: ghcr.io/example/codesentinelx/finding-service:latest
    replicas: 2
    port: 8080
  - name: report-service
    image: ghcr.io/example/codesentinelx/report-service:latest
    replicas: 1
    port: 8080
  - name: identity-service
    image: ghcr.io/example/codesentinelx/identity-service:latest
    replicas: 1
    port: 8080
  - name: integration-service
    image: ghcr.io/example/codesentinelx/integration-service:latest
    replicas: 1
    port: 8080
  - name: audit-service
    image: ghcr.io/example/codesentinelx/audit-service:latest
    replicas: 1
    port: 8080

env:
  LOG_LEVEL: INFO
  POSTGRES_DSN: postgresql://codesentinel:codesentinel@postgres:5432/codesentinelx
  REDIS_URL: redis://redis:6379/0
  ELASTICSEARCH_URL: http://elasticsearch:9200
  RABBITMQ_URL: amqp://rabbitmq:5672
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
